<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/superdoc-logo.png">
  <title>SuperDoc Demos</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap");
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      color: #212121;
      background: #f5f5fa;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    .backgrounds, .background, .background::after { position: fixed; inset: 0; }
    .backgrounds { z-index: 0; }
    .background { opacity: 0; overflow: hidden; transition: opacity .55s ease; pointer-events: none; }
    .background.active { opacity: 1; }
    .background.placeholder {
      background: radial-gradient(circle at -30% -60%, #1355ff, #8968f633, #b785f140, #fcd36152, #e8caec00, #f1e0f073, #f1e0f0, #f5f5fa, #f5f5fa);
    }
    .background::after {
      content: "";
      background: linear-gradient(180deg, transparent 58%, rgba(245, 245, 250, .62));
    }
    .showcase { position: relative; z-index: 1; display: grid; min-height: 100vh; place-items: center; padding: 120px 32px 72px; }
    .site-header { position: absolute; top: 28px; left: 50%; display: flex; align-items: center; gap: 14px; color: #212121; text-decoration: none; transform: translateX(-50%); }
    .site-header img { display: block; width: 96px; height: auto; filter: drop-shadow(0 10px 20px rgba(19, 85, 255, .12)); }
    .site-header h1 { margin: 0; color: #1355ff; background: linear-gradient(90deg, #2563eb, #9333ea); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 60px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; }
    .site-title { display: grid; gap: 1px; }
    .site-subheading { margin: 2px 0 0; color: #5a5a61; font-size: 14px; font-weight: 400; line-height: 1.55; }
    .site-version { margin: 0; color: #71717a; font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
    .demo-stage { position: relative; display: flex; width: min(1280px, calc(100vw - 64px)); gap: 24px; }
    .demo-slide { min-width: 0; flex: 1; }
    .demo-slide.active { animation: reveal .42s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    .demo-card { position: relative; overflow: hidden; border: 1px solid #ececee; border-radius: 18px; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 20px 44px rgba(0, 0, 0, .07); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .demo-card:hover { border-color: #b3c9ff; box-shadow: 0 4px 12px rgba(0, 0, 0, .05), 0 24px 52px rgba(19, 85, 255, .12); transform: translateY(-3px); }
    .card-main-link { position: absolute; z-index: 2; inset: 0; }
    .card-media { position: relative; aspect-ratio: 2.08 / 1; overflow: hidden; border-bottom: 1px solid #ececee; background: #fafafa; }
    .card-poster, .card-video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card-video { position: absolute; inset: 0; opacity: 0; transition: opacity .2s ease; }
    .demo-card.is-previewing .card-video { opacity: 1; }
    .card-placeholder { display: grid; width: 100%; aspect-ratio: 2.08 / 1; place-items: center; color: #1d5cff; background: linear-gradient(135deg, #dce8ff, #f3dcf6); font-size: 38px; font-weight: 720; }
    .card-body { position: relative; min-height: 142px; padding: 22px 26px 24px; color: #212121; background: #fff; text-align: left; }
    .card-body h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
    .card-body p { margin: 0; color: #5a5a61; font-size: 14px; line-height: 1.55; }
    .card-actions { position: absolute; z-index: 3; right: 26px; bottom: 24px; display: flex; align-items: center; gap: 8px; color: #71717a; font-size: 13px; font-weight: 600; }
    .card-actions a { color: #1355ff; text-decoration: none; }
    .card-actions a:hover { text-decoration: underline; }
    .copy-link { width: 44px; padding: 3px 0; border: 1px solid #dbdbdb; border-radius: 6px; color: #5a5a61; background: #fafafa; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 500; cursor: pointer; }
    .copy-link:hover { border-color: #7da2ff; color: #1355ff; }
    .selector { display: none; }
    .demo-selector { width: 42px; height: 8px; padding: 0; border: 0; border-radius: 999px; background: #b3c9ff; box-shadow: 0 1px 8px rgba(19, 85, 255, .12); cursor: pointer; transition: width .2s ease, background .2s ease; }
    .demo-selector:hover { background: #7da2ff; }
    .demo-selector.active { width: 54px; background: #1355ff; }
    .backdrop-label { position: absolute; right: 0; bottom: -48px; margin: 0; color: rgba(255, 255, 255, .8); font-size: 12px; font-weight: 550; letter-spacing: .02em; }
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .showcase { padding: 100px 20px 62px; }
      .site-header { top: 22px; }
      .site-header h1 { font-size: 50px; }
      .site-header img { width: 80px; }
      .demo-stage { display: block; width: min(100%, 620px); }
      .demo-slide { display: none; }
      .demo-slide.active { display: block; }
      .selector { position: static; display: flex; justify-content: center; margin-bottom: 18px; transform: none; }
      .card-video { display: none; }
      .card-body { min-height: 164px; padding: 20px; }
      .card-actions { right: auto; bottom: 20px; left: 20px; }
      .backdrop-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .background, .demo-slide { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="backgrounds" aria-hidden="true">
    <!-- DEMO_BACKGROUNDS:START -->
    <!-- DEMO_BACKGROUNDS:END -->
  </div>
  <main class="showcase">
    <a class="site-header" href="https://superdoc.dev" aria-label="Visit SuperDoc">
      <img src="/superdoc-logo.png" alt="">
      <div class="site-title"><h1>SuperDoc Demos</h1><p class="site-subheading">Open source demos</p><p class="site-version">SuperDoc v2.13.0 (latest)</p></div>
    </a>
    <div class="demo-stage">
      <nav class="selector" aria-label="Choose a demo">
        <!-- DEMO_SELECTORS:START -->
        <!-- DEMO_SELECTORS:END -->
      </nav>
      <!-- DEMO_CARDS:START -->
      <!-- DEMO_CARDS:END -->
    </div>
  </main>
  <script>
    const selectors = [...document.querySelectorAll('.demo-selector')];
    const slides = [...document.querySelectorAll('.demo-slide')];
    const backgrounds = [...document.querySelectorAll('.background')];
    let activeIndex = 0;
    let wheelLocked = false;
    const activate = (index) => {
      activeIndex = index;
      selectors.forEach((selector, item) => {
        selector.classList.toggle('active', item === index);
        selector.setAttribute('aria-pressed', String(item === index));
      });
      slides.forEach((slide, item) => slide.classList.toggle('active', item === index));
      backgrounds.forEach((background, item) => background.classList.toggle('active', item === index));
    };
    selectors.forEach((selector, index) => selector.addEventListener('click', () => activate(index)));
    document.querySelectorAll('.copy-link').forEach((button) => button.addEventListener('click', () => {
      navigator.clipboard.writeText(button.previousElementSibling.href);
      window.clearTimeout(button.copyResetTimer);
      button.textContent = '✓';
      button.copyResetTimer = window.setTimeout(() => { button.textContent = 'Copy'; }, 1000);
    }));
    window.addEventListener('wheel', (event) => {
      if (!window.matchMedia('(max-width: 820px)').matches) return;
      if (wheelLocked || Math.abs(event.deltaY) < Math.abs(event.deltaX) || Math.abs(event.deltaY) < 8) return;
      const nextIndex = Math.max(0, Math.min(selectors.length - 1, activeIndex + Math.sign(event.deltaY)));
      if (nextIndex === activeIndex) return;
      event.preventDefault();
      wheelLocked = true;
      activate(nextIndex);
      window.setTimeout(() => { wheelLocked = false; }, 650);
    }, { passive: false });
    const desktopHover = window.matchMedia('(min-width: 821px) and (hover: hover)');
    document.querySelectorAll('.demo-card').forEach((card) => {
      const video = card.querySelector('.card-video');
      if (!video) return;
      card.addEventListener('pointerenter', () => {
        if (!desktopHover.matches) return;
        card.classList.add('is-previewing');
        video.play().catch(() => {});
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-previewing');
        video.pause();
        video.currentTime = 0;
      });
    });
    activate(0);
  </script>
</body>
</html>
