<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/superdoc-logo.png">
  <title>SuperDoc Demos</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap");
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #212121;
      background: #f5f5fa;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    .backgrounds, .background, .background::after { position: fixed; inset: 0; }
    .backgrounds { z-index: 0; }
    .background { opacity: 0; overflow: hidden; transition: opacity .55s ease; pointer-events: none; }
    .background.active { opacity: 1; }
    .background.placeholder {
      background: radial-gradient(circle at -30% -60%, #1355ff, #8968f633, #b785f140, #fcd36152, #e8caec00, #f1e0f073, #f1e0f0, #f5f5fa, #f5f5fa);
    }
    .background::after {
      content: "";
      background: linear-gradient(180deg, transparent 58%, rgba(245, 245, 250, .62));
    }
    .showcase { position: relative; z-index: 1; display: grid; min-height: 100vh; place-items: center; padding: 210px 32px 72px; }
    .site-header { position: absolute; top: 28px; left: 50%; display: flex; align-items: center; gap: 14px; color: #212121; text-decoration: none; transform: translateX(-50%); }
    .site-header img { display: block; width: 96px; height: auto; filter: drop-shadow(0 10px 20px rgba(19, 85, 255, .12)); }
    .site-header h1 { margin: 0; color: #1355ff; background: linear-gradient(90deg, #2563eb, #9333ea); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 60px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; }
    .site-title { display: grid; gap: 1px; }
    .site-subheading { margin: 2px 0 0; color: #5a5a61; font-size: 14px; font-weight: 400; line-height: 1.55; }
    .site-version { margin: 0; color: #71717a; font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
    .demo-stage { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(1120px, 100%); gap: 24px; }
    .demo-slide { display: flex; min-width: 0; }
    .demo-slide.active { animation: reveal .42s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    .demo-card { position: relative; display: flex; flex-direction: column; width: 100%; overflow: hidden; border: 1px solid #ececee; border-radius: 18px; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 20px 44px rgba(0, 0, 0, .07); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .demo-card:hover { border-color: #b3c9ff; box-shadow: 0 4px 12px rgba(0, 0, 0, .05), 0 24px 52px rgba(19, 85, 255, .12); transform: translateY(-3px); }
    .card-main-link { position: absolute; z-index: 2; inset: 0; }
    .card-media { position: relative; flex-shrink: 0; aspect-ratio: 2.08 / 1; overflow: hidden; border-bottom: 1px solid #ececee; background: #fafafa; }
    .card-poster, .card-video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card-video { position: absolute; inset: 0; opacity: 0; transition: opacity .2s ease; }
    .demo-card.is-previewing .card-video { opacity: 1; }
    .card-placeholder { display: grid; width: 100%; aspect-ratio: 2.08 / 1; place-items: center; color: #1d5cff; background: linear-gradient(135deg, #dce8ff, #f3dcf6); font-size: 38px; font-weight: 720; }
    .card-body { position: relative; display: flex; flex: 1; flex-direction: column; min-height: 164px; padding: 20px; color: #212121; background: #fff; text-align: left; }
    .card-body h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
    .card-body p { margin: 0; color: #5a5a61; font-size: 14px; line-height: 1.55; }
    .card-footer { margin-top: auto; padding-top: 18px; }
    .card-actions { position: relative; z-index: 3; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; color: #71717a; font-size: 13px; font-weight: 600; }
    .card-actions a { color: #1355ff; text-decoration: none; }
    .card-actions a:hover { text-decoration: underline; }
    .build-app-button, .build-command-copy { border: 0; border-radius: 6px; padding: 8px 12px; color: #fff; background: #1355ff; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .build-app-button { margin-left: 4px; }
    .build-app-button:hover, .build-command-copy:hover { background: #1047d6; }
    .build-dialog { width: min(720px, calc(100vw - 40px)); max-height: calc(100dvh - 40px); padding: 0; overflow: auto; color: #212121; background: #fff; border: 1px solid #d1d5db; border-radius: 14px; box-shadow: 0 24px 80px #0f172a40; }
    .build-dialog::backdrop { background: #0f172a66; }
    .build-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 22px 24px 18px; border-bottom: 1px solid #e5e7eb; }
    .build-dialog-header h2 { margin: 0 0 6px; font-size: 20px; }
    .build-dialog-header p { margin: 0; color: #64748b; font-size: 13px; line-height: 1.5; }
    .build-dialog-close { padding: 0 6px; border: 0; color: #64748b; background: transparent; font-size: 25px; cursor: pointer; }
    .build-dialog-body { padding: 20px 24px 24px; }
    .build-dialog-body pre { margin: 0 0 14px; padding: 16px; overflow-x: auto; color: #e2e8f0; background: #0f172a; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .build-dialog-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
    .build-dialog-actions a { color: #1355ff; font-size: 12px; font-weight: 600; }
    .build-copy-status, .build-dialog-note { margin: 16px 0 0; color: #64748b; font-size: 12px; line-height: 1.5; }
    .build-copy-status:empty { display: none; }
    .backdrop-label { position: absolute; right: 0; bottom: -48px; margin: 0; color: rgba(255, 255, 255, .8); font-size: 12px; font-weight: 550; letter-spacing: .02em; }
    @media (max-width: 1100px) {
      .demo-stage { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .showcase { padding: 160px 20px 62px; }
      .site-header { top: 22px; }
      .site-header h1 { font-size: clamp(24px, 6.4vw, 50px); }
      .site-header img { width: clamp(48px, 10vw, 80px); }
      .card-video { display: none; }
      .card-body { min-height: 164px; padding: 20px; }
      .backdrop-label { display: none; }
    }
    @media (max-width: 640px) {
      .demo-stage { grid-template-columns: minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .background, .demo-slide { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="backgrounds" aria-hidden="true">
    <!-- DEMO_BACKGROUNDS:START -->
    <!-- DEMO_BACKGROUNDS:END -->
  </div>
  <main class="showcase">
    <a class="site-header" href="https://superdoc.dev" aria-label="Visit SuperDoc">
      <img src="/superdoc-logo.png" alt="">
      <div class="site-title"><h1>SuperDoc Demos</h1><p class="site-subheading">Open source demos</p><p class="site-version">SuperDoc v2.31.0 (latest)</p></div>
    </a>
    <div class="demo-stage">
      <!-- DEMO_CARDS:START -->
      <!-- DEMO_CARDS:END -->
    </div>
  </main>
  <!-- BUILD_DIALOGS:START -->
  <!-- BUILD_DIALOGS:END -->
  <script>
    document.querySelectorAll('[data-build-dialog]').forEach((button) => {
      button.addEventListener('click', () => document.getElementById(button.dataset.buildDialog).showModal());
    });
    document.querySelectorAll('.build-dialog').forEach((dialog) => {
      const copy = dialog.querySelector('.build-command-copy');
      const status = dialog.querySelector('.build-copy-status');
      dialog.querySelector('.build-dialog-close').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      dialog.addEventListener('close', () => { copy.textContent = 'Copy all commands'; status.textContent = ''; });
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(dialog.querySelector('code').textContent);
          copy.textContent = 'Copied';
          status.textContent = 'Commands copied to clipboard.';
        } catch {
          status.textContent = 'Could not access the clipboard. Select the commands above and copy them.';
        }
      });
    });
    const desktopHover = window.matchMedia('(min-width: 821px) and (hover: hover)');
    document.querySelectorAll('.demo-card').forEach((card) => {
      const video = card.querySelector('.card-video');
      if (!video) return;
      card.addEventListener('pointerenter', () => {
        if (!desktopHover.matches) return;
        card.classList.add('is-previewing');
        video.play().catch(() => {});
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-previewing');
        video.pause();
        video.currentTime = 0;
      });
    });
  </script>
</body>
</html>
