<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/superdoc-logo.png">
  <title>SuperDoc Demos</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background: #15233c;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    .backgrounds, .background, .background::after { position: fixed; inset: 0; }
    .backgrounds { z-index: 0; }
    .background { opacity: 0; overflow: hidden; transition: opacity .55s ease; pointer-events: none; }
    .background.active { opacity: 1; }
    .background video { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); filter: saturate(.82) contrast(.92); }
    .background.placeholder { background: radial-gradient(circle at 65% 25%, #6b7ee8, transparent 42%), linear-gradient(135deg, #172b50, #533b7b); }
    .background::after {
      content: "";
      background:
        linear-gradient(180deg, rgba(6, 14, 31, .26) 0%, rgba(7, 15, 31, .38) 46%, rgba(5, 12, 26, .92) 100%),
        linear-gradient(90deg, rgba(5, 12, 28, .36), transparent 38%, rgba(5, 12, 28, .18));
    }
    .showcase { position: relative; z-index: 1; display: grid; min-height: 100vh; place-items: center; padding: 120px 32px 72px; }
    .site-header { position: absolute; top: 28px; left: 50%; display: flex; align-items: center; gap: 14px; color: #fff; text-decoration: none; transform: translateX(-50%); }
    .site-header img { display: block; width: 96px; height: auto; filter: drop-shadow(0 8px 15px rgba(0, 0, 0, .2)); }
    .site-header h1 { margin: 0; font-size: 60px; font-weight: 680; letter-spacing: -.04em; white-space: nowrap; text-shadow: 0 2px 14px rgba(0, 0, 0, .3); }
    .demo-stage { position: relative; width: min(760px, 72vw); }
    .demo-slide { display: none; }
    .demo-slide.active { display: block; animation: reveal .42s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    .demo-card { position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, .72); border-radius: 20px; background: rgba(255, 255, 255, .94); box-shadow: 0 30px 80px rgba(0, 0, 0, .34); }
    .card-main-link { position: absolute; z-index: 2; inset: 0; }
    .card-poster { display: block; width: 100%; aspect-ratio: 2.08 / 1; object-fit: cover; border-bottom: 1px solid #dce2eb; }
    .card-placeholder { display: grid; width: 100%; aspect-ratio: 2.08 / 1; place-items: center; color: #1d5cff; background: linear-gradient(135deg, #dce8ff, #f3dcf6); font-size: 38px; font-weight: 720; }
    .card-body { position: relative; min-height: 142px; padding: 22px 26px 24px; color: #f8fbff; background: #101b2e; text-align: left; }
    .card-body h2 { margin: 0 0 6px; font-size: 19px; font-weight: 720; letter-spacing: -.025em; }
    .card-body p { margin: 0; color: #b9c4d5; font-size: 13px; line-height: 1.45; }
    .card-body .card-version { margin-top: 8px; color: #7f91ad; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 600; }
    .card-actions { position: absolute; z-index: 3; right: 26px; bottom: 24px; display: flex; align-items: center; gap: 8px; color: #a1aabc; font-size: 13px; font-weight: 680; }
    .card-actions a { color: #78a7ff; text-decoration: none; }
    .card-actions a:hover { text-decoration: underline; }
    .selector { position: absolute; top: 50%; right: calc(100% + 34px); display: grid; gap: 14px; transform: translateY(-50%); }
    .demo-selector { width: 42px; height: 8px; padding: 0; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .48); box-shadow: 0 1px 8px rgba(0, 0, 0, .16); cursor: pointer; transition: width .2s ease, background .2s ease; }
    .demo-selector:hover { background: rgba(255, 255, 255, .76); }
    .demo-selector.active { width: 54px; background: #fff; }
    .backdrop-label { position: absolute; right: 0; bottom: -48px; margin: 0; color: rgba(255, 255, 255, .8); font-size: 12px; font-weight: 550; letter-spacing: .02em; }
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .showcase { padding: 100px 20px 62px; }
      .site-header { top: 22px; }
      .site-header h1 { font-size: 50px; }
      .site-header img { width: 80px; }
      .demo-stage { width: min(100%, 620px); }
      .selector { position: static; display: flex; justify-content: center; margin-bottom: 18px; transform: none; }
      .card-body { min-height: 164px; padding: 20px; }
      .card-actions { right: auto; bottom: 20px; left: 20px; }
      .backdrop-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .background, .demo-slide { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="backgrounds" aria-hidden="true">
    <div class="background active"><video autoplay muted loop playsinline preload="metadata"><source src="/inline-revisions-preview.mp4" type="video/mp4"></video></div>
    <div class="background"><video autoplay muted loop playsinline preload="metadata"><source src="/template-builder-preview.mp4" type="video/mp4"></video></div>
    <div class="background placeholder" data-local-exclude></div>
  </div>
  <main class="showcase">
    <a class="site-header" href="https://superdoc.dev" aria-label="Visit SuperDoc">
      <img src="/superdoc-logo.png" alt="">
      <h1>Demos</h1>
    </a>
    <div class="demo-stage">
      <nav class="selector" aria-label="Choose a demo">
        <button class="demo-selector active" type="button" aria-label="Show Inline Revisions" aria-pressed="true"></button>
        <button class="demo-selector" type="button" aria-label="Show Template Builder API v2" aria-pressed="false"></button>
        <button class="demo-selector" type="button" aria-label="Show DocRAG" aria-pressed="false" data-local-exclude></button>
      </nav>
      <article class="demo-slide active">
        <div class="demo-card">
          <a class="card-main-link" href="/superdoc-inline-revisions/" aria-label="Open Inline Revisions demo"></a>
          <img class="card-poster" src="/inline-revisions-poster.jpg" alt="Inline Revisions demo preview">
          <div class="card-body"><h2>Inline Revisions</h2><p>Comments and tracked-change review</p><p class="card-version">SuperDoc v2.13.0</p><div class="card-actions"><a href="/superdoc-inline-revisions/">Live demo</a><span>|</span><a href="https://github.com/superdoc/demos/tree/main/superdoc-inline-revisions" target="_blank" rel="noopener noreferrer">Source</a></div></div>
        </div>
      </article>
      <article class="demo-slide">
        <div class="demo-card">
          <a class="card-main-link" href="/template-builder-document-api-v2-demo/" aria-label="Open Template Builder API v2 demo"></a>
          <img class="card-poster" src="/template-builder-poster.jpg" alt="Template Builder demo preview">
          <div class="card-body"><h2>Template Builder API v2</h2><p>Template fields with the Document API</p><p class="card-version">SuperDoc v2.13.0</p><div class="card-actions"><a href="/template-builder-document-api-v2-demo/">Live demo</a><span>|</span><a href="https://github.com/superdoc/demos/tree/main/template-builder-document-api-v2-demo" target="_blank" rel="noopener noreferrer">Source</a></div></div>
        </div>
      </article>
      <article class="demo-slide" data-local-exclude>
        <div class="demo-card">
          <a class="card-main-link" href="/docrag/" aria-label="Open DocRAG demo"></a>
          <div class="card-placeholder">DocRAG</div>
          <div class="card-body"><h2>DocRAG</h2><p>Document Q&amp;A with citations</p><p class="card-version">SuperDoc v2.13.0</p><div class="card-actions"><a href="/docrag/">Live demo</a><span>|</span><a href="https://github.com/superdoc/demos/tree/main/rag" target="_blank" rel="noopener noreferrer">Source</a></div></div>
        </div>
      </article>
    </div>
  </main>
  <script>
    const selectors = [...document.querySelectorAll('.demo-selector')];
    const slides = [...document.querySelectorAll('.demo-slide')];
    const backgrounds = [...document.querySelectorAll('.background')];
    let activeIndex = 0;
    let wheelLocked = false;
    const activate = (index) => {
      activeIndex = index;
      selectors.forEach((selector, item) => {
        selector.classList.toggle('active', item === index);
        selector.setAttribute('aria-pressed', String(item === index));
      });
      slides.forEach((slide, item) => slide.classList.toggle('active', item === index));
      backgrounds.forEach((background, item) => {
        background.classList.toggle('active', item === index);
        const video = background.querySelector('video');
        if (video) item === index ? video.play().catch(() => {}) : video.pause();
      });
    };
    selectors.forEach((selector, index) => selector.addEventListener('click', () => activate(index)));
    window.addEventListener('wheel', (event) => {
      if (wheelLocked || Math.abs(event.deltaY) < Math.abs(event.deltaX) || Math.abs(event.deltaY) < 8) return;
      const nextIndex = Math.max(0, Math.min(selectors.length - 1, activeIndex + Math.sign(event.deltaY)));
      if (nextIndex === activeIndex) return;
      event.preventDefault();
      wheelLocked = true;
      activate(nextIndex);
      window.setTimeout(() => { wheelLocked = false; }, 650);
    }, { passive: false });
    activate(0);
  </script>
</body>
</html>
