name: Deploy Demos V2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy to
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      dry_run:
        description: Build and validate without deploying to Cloudflare
        type: boolean
        required: true
        default: true

  workflow_call:
    inputs:
      environment:
        type: string
        default: staging
      dry_run:
        type: boolean
        default: true
      ref:
        type: string
        required: true
      source_artifact:
        type: string
        required: true

concurrency:
  group: superdoc-demos-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      source_artifact: ${{ inputs.source_artifact }}

  release:
    name: Build release bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Download updated source
        if: inputs.source_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: /tmp/superdoc-source
      - name: Restore tested dependency update
        if: inputs.source_artifact != ''
        run: tar -xzf /tmp/superdoc-source/superdoc-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Validate version history deployment settings
        if: inputs.dry_run == false
        env:
          VERSION_HISTORY_BACKEND_URL: ${{ vars.VERSION_HISTORY_BACKEND_URL }}
          VERSION_HISTORY_RAILWAY_SERVICE_ID: ${{ secrets.VERSION_HISTORY_RAILWAY_SERVICE_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          test -n "$VERSION_HISTORY_BACKEND_URL" || { echo 'Set the VERSION_HISTORY_BACKEND_URL repository variable.' >&2; exit 1; }
          if [ "$TARGET_ENVIRONMENT" = production ]; then
            test -n "$VERSION_HISTORY_RAILWAY_SERVICE_ID" || { echo 'Set the VERSION_HISTORY_RAILWAY_SERVICE_ID repository secret.' >&2; exit 1; }
          fi

      - name: Build DocRAG
        working-directory: rag
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /docrag/
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build Inline Revisions
        working-directory: superdoc-inline-revisions
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Template Builder Document API v2
        working-directory: template-builder-document-api-v2-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Canonical Collaboration client
        working-directory: canonical-collaboration-demo/client
        env:
          VITE_API_URL: ${{ vars.COLLAB_API_URL || 'https://canonical-collab-demo-backend-production.up.railway.app' }}
          VITE_COLLABORATION_AGENT: 'on'
        run: |
          npm ci
          npm run build

      - name: Build Version History
        working-directory: version-history
        env:
          BASE_PATH: /version-history/
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile DocRAG Worker without deploying
        working-directory: rag/apps/api
        run: bunx wrangler deploy --dry-run --outdir ../../../worker-dist

      - name: Assemble release bundle
        env:
          VERSION_HISTORY_BACKEND_URL: ${{ vars.VERSION_HISTORY_BACKEND_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ] && [ -z "$VERSION_HISTORY_BACKEND_URL" ]; then
            export VERSION_HISTORY_BACKEND_URL=https://version-history.invalid
          fi
          node scripts/assemble-release.mjs

      - name: Compile Pages API and WebSocket proxy without deploying
        run: bunx wrangler pages functions build --build-output-directory=dist --outdir=pages-worker-dist

      - name: Upload tested release bundle
        uses: actions/upload-artifact@v4
        with:
          name: superdoc-demos-${{ inputs.ref || github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            worker-dist/
            pages-worker-dist/
          retention-days: 7

      - name: Deploy DocRAG API Worker
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        working-directory: rag/apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Deploy Canonical Collaboration API
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        working-directory: canonical-collaboration-demo/server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: npx -y @railway/cli@latest up --service "$RAILWAY_SERVICE_ID" --environment production --detach --yes

      - name: Verify Canonical Collaboration API
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        env:
          COLLAB_API_URL: ${{ vars.COLLAB_API_URL || 'https://canonical-collab-demo-backend-production.up.railway.app' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$COLLAB_API_URL/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Collaboration API did not become healthy." >&2
          exit 1

      - name: Deploy Version History backend
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        working-directory: version-history
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERSION_HISTORY_RAILWAY_SERVICE_ID: ${{ secrets.VERSION_HISTORY_RAILWAY_SERVICE_ID }}
          RAILWAY_CALLER: skill:use-railway@1.2.1
          RAILWAY_AGENT_SESSION: version-history-release-${{ github.run_id }}
        run: npx -y @railway/cli@4.58.0 up . --path-as-root --service "$VERSION_HISTORY_RAILWAY_SERVICE_ID" --environment production --ci -m "Version history $GITHUB_SHA"

      - name: Verify Version History backend
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION_HISTORY_BACKEND_URL: ${{ vars.VERSION_HISTORY_BACKEND_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "$VERSION_HISTORY_BACKEND_URL/api/health"

      - name: Deploy gallery and demos to production
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deploy dist \
            --project-name=superdoc-demos \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-dirty=true

      - name: Verify production gallery version
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        run: node scripts/verify-production-gallery.mjs

      - name: Verify production collaboration editor workers
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        run: node scripts/verify-collab-workers.mjs

      - name: Verify production Version History route and API proxy
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 https://demos.superdoc.dev/version-history/ | grep -q 'id="root"'
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 https://demos.superdoc.dev/version-history/api/health

      - name: Deploy gallery and demos to staging
        id: staging
        if: ${{ inputs.dry_run == false && inputs.environment == 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="staging-${GITHUB_SHA::7}"
          bunx wrangler pages deploy dist \
            --project-name=superdoc-demos \
            --branch="$branch" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true | tee staging-deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' staging-deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify staging collaboration editor workers
        if: ${{ steps.staging.outputs.url != '' }}
        env:
          DEMOS_VERIFY_URL: ${{ steps.staging.outputs.url }}
        run: node scripts/verify-collab-workers.mjs

      - name: Publish staging URL
        if: ${{ steps.staging.outputs.url != '' }}
        env:
          STAGING_URL: ${{ steps.staging.outputs.url }}
        run: |
          echo "## Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$STAGING_URL]($STAGING_URL)" >> "$GITHUB_STEP_SUMMARY"
