name: Deploy Demos

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit

  deploy-api:
    name: Deploy API Worker
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx wrangler deploy
        working-directory: rag/apps/api

  deploy-web:
    name: Deploy All Demos
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      # Build DocRAG
      - run: bun install --frozen-lockfile
        working-directory: rag
      - run: bunx vite build
        working-directory: rag/apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /docrag/

      # Build Inline Revisions
      - run: pnpm install --frozen-lockfile
        working-directory: superdoc-inline-revisions
      - run: pnpm build
        working-directory: superdoc-inline-revisions

      # Build Template Builder Document API v2
      - run: pnpm install --frozen-lockfile
        working-directory: template-builder-document-api-v2-demo
      - run: pnpm build
        working-directory: template-builder-document-api-v2-demo

      # Assemble dist
      - run: |
          mkdir -p dist/docrag dist/superdoc-inline-revisions dist/template-builder-document-api-v2-demo
          cp -r rag/apps/web/dist/* dist/docrag/
          cp -r superdoc-inline-revisions/dist/* dist/superdoc-inline-revisions/
          cp -r template-builder-document-api-v2-demo/dist/* dist/template-builder-document-api-v2-demo/
          cp -r dist-landing/* dist/

      # Deploy
      - run: bunx wrangler pages deploy dist --project-name=superdoc-demos --commit-dirty=true
