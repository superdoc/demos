name: Deploy Demos V2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without deploying to Cloudflare
        type: boolean
        required: true
        default: true

concurrency:
  group: superdoc-demos-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  release:
    name: Build release bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Build DocRAG
        working-directory: rag
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /docrag/
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build Inline Revisions
        working-directory: superdoc-inline-revisions
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Template Builder Document API v2
        working-directory: template-builder-document-api-v2-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile DocRAG Worker without deploying
        working-directory: rag/apps/api
        run: bunx wrangler deploy --dry-run --outdir ../../../worker-dist

      - name: Assemble production bundle
        run: |
          mkdir -p dist/docrag dist/superdoc-inline-revisions dist/template-builder-document-api-v2-demo
          cp -r rag/apps/web/dist/* dist/docrag/
          cp -r superdoc-inline-revisions/dist/* dist/superdoc-inline-revisions/
          cp -r template-builder-document-api-v2-demo/dist/* dist/template-builder-document-api-v2-demo/
          cp -r dist-landing/* dist/

      - name: Upload tested release bundle
        uses: actions/upload-artifact@v4
        with:
          name: superdoc-demos-${{ github.sha }}
          path: |
            dist/
            worker-dist/
          retention-days: 7

      - name: Deploy DocRAG API Worker
        if: ${{ inputs.dry_run == false }}
        working-directory: rag/apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Deploy gallery and demos
        if: ${{ inputs.dry_run == false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name=superdoc-demos --commit-dirty=true
