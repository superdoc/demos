name: Deploy Demos V2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy to
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      dry_run:
        description: Build and validate without deploying to Cloudflare
        type: boolean
        required: true
        default: true

concurrency:
  group: superdoc-demos-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  release:
    name: Build release bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Build DocRAG
        working-directory: rag
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /docrag/
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build Inline Revisions
        working-directory: superdoc-inline-revisions
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Template Builder Document API v2
        working-directory: template-builder-document-api-v2-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Canonical Collaboration client
        working-directory: canonical-collaboration-demo/client
        env:
          VITE_API_URL: ${{ vars.COLLAB_API_URL || 'https://canonical-collab-demo-backend-production.up.railway.app' }}
        run: |
          npm ci
          npm run build

      - name: Compile DocRAG Worker without deploying
        working-directory: rag/apps/api
        run: bunx wrangler deploy --dry-run --outdir ../../../worker-dist

      - name: Assemble release bundle
        run: node scripts/assemble-release.mjs

      - name: Upload tested release bundle
        uses: actions/upload-artifact@v4
        with:
          name: superdoc-demos-${{ github.sha }}
          path: |
            dist/
            worker-dist/
          retention-days: 7

      - name: Deploy DocRAG API Worker
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        working-directory: rag/apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Deploy Canonical Collaboration API
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        working-directory: canonical-collaboration-demo/server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: npx -y @railway/cli@latest up --service "$RAILWAY_SERVICE_ID" --environment production --detach --yes

      - name: Verify Canonical Collaboration API
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        env:
          COLLAB_API_URL: ${{ vars.COLLAB_API_URL || 'https://canonical-collab-demo-backend-production.up.railway.app' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$COLLAB_API_URL/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Collaboration API did not become healthy." >&2
          exit 1

      - name: Deploy gallery and demos to production
        if: ${{ inputs.dry_run == false && inputs.environment == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name=superdoc-demos --commit-dirty=true

      - name: Deploy gallery and demos to staging
        id: staging
        if: ${{ inputs.dry_run == false && inputs.environment == 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="staging-${GITHUB_SHA::7}"
          bunx wrangler pages deploy dist \
            --project-name=superdoc-demos \
            --branch="$branch" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true | tee staging-deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' staging-deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish staging URL
        if: ${{ steps.staging.outputs.url != '' }}
        env:
          STAGING_URL: ${{ steps.staging.outputs.url }}
        run: |
          echo "## Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$STAGING_URL]($STAGING_URL)" >> "$GITHUB_STEP_SUMMARY"
