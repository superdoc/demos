name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rag-check:
    name: rag - Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit

  build-demos:
    name: Build ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [superdoc-inline-revisions, template-builder-document-api-v2-demo]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.demo }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  build-rag-web:
    name: Build rag/web
    needs: rag-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: rag
      - run: bunx vite build
        working-directory: rag/apps/web

  smoke:
    name: Smoke - ${{ matrix.demo }}
    needs: build-demos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [superdoc-inline-revisions, template-builder-document-api-v2-demo]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo
        working-directory: ${{ matrix.demo }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright
        working-directory: tests
        run: |
          pnpm install
          pnpm exec playwright install --with-deps chromium
      - name: Run smoke test
        working-directory: tests
        env:
          DEMO: ${{ matrix.demo }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-${{ matrix.demo }}
          path: tests/test-results/
          retention-days: 7
