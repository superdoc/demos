name: Update SuperDoc

on:
  workflow_dispatch:
    inputs:
      version:
        description: SuperDoc version or npm tag
        required: true
        default: latest
      dry_run:
        description: Build and test without committing or deploying
        type: boolean
        required: true
        default: true

  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
    outputs:
      commit_sha:
        value: ${{ jobs.update.outputs.commit_sha }}
      source_artifact:
        value: ${{ jobs.update.outputs.source_artifact }}

permissions:
  contents: write

concurrency:
  group: superdoc-dependency-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update dependencies
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.sha }}
      source_artifact: superdoc-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update all demos and gallery version labels
        env:
          SUPERDOC_VERSION: ${{ inputs.version }}
        run: node scripts/update-superdoc.mjs "$SUPERDOC_VERSION"
      - name: Show proposed update
        run: |
          git status --short
          git diff --stat
          git diff --check
      - name: Build every demo
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          COLLAB_API_URL: ${{ vars.COLLAB_API_URL || 'https://canonical-collab-demo-backend-production.up.railway.app' }}
        run: |
          bun run --cwd rag build:web
          pnpm --dir superdoc-inline-revisions build
          pnpm --dir template-builder-document-api-v2-demo build
          npm ci --prefix canonical-collaboration-demo/client
          VITE_API_URL="$COLLAB_API_URL" npm run build --prefix canonical-collaboration-demo/client
      - name: Run unit tests when present
        run: |
          node scripts/run-optional-tests.mjs rag unit bun
          node scripts/run-optional-tests.mjs superdoc-inline-revisions unit pnpm
          node scripts/run-optional-tests.mjs template-builder-document-api-v2-demo unit pnpm
          node scripts/run-optional-tests.mjs canonical-collaboration-demo/client unit npm
      - name: Install browser test runner
        working-directory: tests
        run: pnpm install
      - name: Install Chromium
        working-directory: tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests for every demo
        working-directory: tests
        run: pnpm exec playwright test
      - name: Run demo-specific browser tests when present
        run: |
          node scripts/run-optional-tests.mjs rag browser bun
          node scripts/run-optional-tests.mjs superdoc-inline-revisions browser pnpm
          node scripts/run-optional-tests.mjs template-builder-document-api-v2-demo browser pnpm
          node scripts/run-optional-tests.mjs canonical-collaboration-demo/client browser npm
      - name: Rebuild DocRAG for its production base path
        working-directory: rag
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /docrag/
        run: bun run build:web
      - name: Compile DocRAG Worker without deploying
        working-directory: rag/apps/api
        run: bunx wrangler deploy --dry-run --outdir ../../../worker-dist
      - name: Assemble release candidate
        run: node scripts/assemble-release.mjs
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: superdoc-update-${{ github.run_id }}
          path: |
            dist/
            worker-dist/
          retention-days: 7
      - name: Commit update to main
        if: ${{ !inputs.dry_run }}
        run: |
          resolved=$(node -p "require('./superdoc-inline-revisions/node_modules/superdoc/package.json').version")
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --pathspec-from-file=.github/superdoc-update-files.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SuperDoc to ${resolved}"
            git push origin HEAD:main
          fi
      - name: Capture tested source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package updated manifests, lockfiles, and gallery labels
        run: tar -czf /tmp/superdoc-source.tar.gz -T .github/superdoc-update-files.txt
      - name: Upload updated source for deployment validation
        uses: actions/upload-artifact@v4
        with:
          name: superdoc-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/superdoc-source.tar.gz
          retention-days: 7
